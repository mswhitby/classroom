name: Publish verified Playground and Python updates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-playground.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-playground
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: mswhitby/playground
          ref: de5ebc840b2f1736d0f6ac3899d902918bb538e1
          path: playground
      - uses: actions/checkout@v4
        with:
          repository: mswhitby/game-programming
          ref: fe35f56072ffe76d91920835fd34c65ec3e0ac9a
          path: game-programming
      - uses: actions/checkout@v4
        with:
          repository: mswhitby/mobile-app-dev
          ref: c2127b44a4fe3f7474ff8d30ab0c5d59fd353331
          path: mobile-app-dev
      - uses: actions/checkout@v4
        with:
          repository: mswhitby/uil
          ref: 2d2f022f2ce39b15c1f8f719e479deb967a5a17f
          path: uil
      - uses: actions/checkout@v4
        with:
          repository: mswhitby/computer-science-1
          ref: 68b8ce79ee03c199cd1efb47ad545b92694d9e28
          path: computer-science-1
      - uses: actions/checkout@v4
        with:
          repository: mswhitby/TSI
          ref: 55780bcf7a8f2f95c3c91bee8e1d6e7f6c26e9d7
          path: TSI
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and build editor assets
        working-directory: playground
        run: |
          npm ci
          npm test
          npm run test:database
          npm run build:ui
          python scripts/prepare-java-runtime.py
          python scripts/build.py --tsi-source ../TSI
          npx playwright install --with-deps chromium
          npm run test:browser
          python scripts/verify-font-assets.py
      - name: Update only the two course deployment folders
        run: |
          rsync -a --delete --exclude='preview/' playground/dist/ site/playground/
          rsync -a --delete computer-science-1/docs/ site/computer-science-1/
      - name: Save built files (the push triggers one Pages build)
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playground computer-science-1
          if ! git diff --cached --quiet; then
            git commit -m 'Publish expanded Python curriculum and archive-safe student grade history'
            git push origin HEAD:main
          fi
