name: Publish verified Playground and Python updates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-playground.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-playground
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: mswhitby/playground
          ref: 3722b2a8f7dc9219e66c284d46da859e08dddb8e
          path: playground
      - uses: actions/checkout@v4
        with:
          repository: mswhitby/game-programming
          ref: fe35f56072ffe76d91920835fd34c65ec3e0ac9a
          path: game-programming
      - uses: actions/checkout@v4
        with:
          repository: mswhitby/mobile-app-dev
          ref: d244168fc2d418b76778ddace1c58342ed328b83
          path: mobile-app-dev
      - uses: actions/checkout@v4
        with:
          repository: mswhitby/uil
          ref: 2d2f022f2ce39b15c1f8f719e479deb967a5a17f
          path: uil
      - uses: actions/checkout@v4
        with:
          repository: mswhitby/computer-science-1
          ref: 6bf5a15085339588e2e3bde57b8b95aec9e7d672
          path: computer-science-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and build editor assets
        working-directory: playground
        run: |
          npm ci
          npm test
          npm run test:database
          npm run build:ui
          python scripts/prepare-java-runtime.py
          python scripts/build.py
          npx playwright install --with-deps chromium
          npm run test:browser
          python -c "from pathlib import Path; assert not [p for p in Path('dist').rglob('*') if p.suffix.lower() in {'.woff', '.woff2', '.ttf', '.otf'}], 'Font binaries must not be published'"
      - name: Update only the two course deployment folders
        run: |
          rsync -a --delete playground/dist/ site/playground/
          rsync -a --delete computer-science-1/docs/ site/computer-science-1/
      - name: Save built files and request the existing Pages build
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playground computer-science-1
          if ! git diff --cached --quiet; then
            git commit -m 'Publish shared Playground redesign and native Python routes'
            git push origin HEAD:main
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
