name: Publish isolated CS1 read-only integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cs1-readonly-integration.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-cs1-readonly-integration
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website without altering production
        uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: true
      - name: Checkout tested canonical production adapter
        uses: actions/checkout@v4
        with:
          repository: mswhitby/playground
          ref: 23781e9ce389fee668eab6aeca674c3dbf42a374
          path: playground
      - name: Checkout tested React CS1 integration view
        uses: actions/checkout@v4
        with:
          repository: mswhitby/playground-react
          ref: 1b322d535f359bf77eb42d7db4873c114a68232a
          path: react
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical read-only account service
        working-directory: playground
        run: |
          npm ci --no-audit --no-fund
          node --test tests/react-integration-readonly.test.mjs
      - name: Verify React isolated mode
        working-directory: react
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Compile canonical read-only authentication and grade bridge
        run: |
          mkdir -p site/playground/integration
          cd playground
          npx esbuild frontend/integration-readonly.js --bundle --format=esm --platform=browser --minify --outfile=../site/playground/integration/account-bridge.js
      - name: Build isolated React site
        working-directory: react
        env:
          VITE_HASH_ROUTING: 'true'
          VITE_READONLY_INTEGRATION: 'true'
        run: npm run build -- --base=/playground/integration/
      - name: Copy only the integration test assets
        run: |
          cp -a react/dist/. site/playground/integration/
          test -f site/playground/integration/index.html
          test -f site/playground/integration/account-bridge.js
          test -f site/playground/integration/python-worker.js
          grep -q '/playground/integration/assets/' site/playground/integration/index.html
      - name: Publish only the separate integration directory
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playground/integration
          if ! git diff --cached --quiet; then
            git commit -m 'Publish isolated CS1 read-only React integration test'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo 'Could not publish isolated integration after three attempts.'
                exit 1
              fi
            done
          fi
