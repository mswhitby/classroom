name: Publish isolated React CS1 preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-react-cs1-preview.yml'
permissions:
  contents: write
concurrency:
  group: publish-react-cs1-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published website
        uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: true
      - name: Checkout reviewed React frontend
        uses: actions/checkout@v4
        with:
          repository: mswhitby/playground-react
          ref: a60dd68dda4195e765a0c37eaeebb7bf83510474
          path: react
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and verify preview
        working-directory: react
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Build isolated hosted preview
        working-directory: react
        env:
          VITE_HASH_ROUTING: 'true'
        run: npm run build -- --base=/playground/preview/
      - name: Copy React entry page and assets, preserving other previews
        run: |
          mkdir -p site/playground/preview/assets
          # The former root preview was the journals demo. Keep its own URL.
          if [ ! -f site/playground/preview/journals.html ]; then
            cp site/playground/preview/index.html site/playground/preview/journals.html
          fi
          # Only replace the React app entry, its generated assets and worker.
          # Do not delete challenges.html, journal scripts, CSS, or other previews.
          rsync -a react/dist/assets/ site/playground/preview/assets/
          cp react/dist/index.html site/playground/preview/index.html
          cp react/dist/python-worker.js site/playground/preview/python-worker.js
      - name: Publish preview without altering production assets
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playground/preview/index.html playground/preview/assets playground/preview/python-worker.js playground/preview/journals.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish React frontend at Playground preview root, preserving journal and challenge previews'
            # Other preview files can be updated independently. Rebase our isolated
            # preview changes onto the newest website revision before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo 'Could not publish the preview after three attempts.'
                exit 1
              fi
            done
          fi
