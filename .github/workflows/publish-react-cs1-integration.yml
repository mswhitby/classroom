name: Publish isolated React CS1 integration test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-react-cs1-integration.yml'
permissions:
  contents: write
concurrency:
  group: publish-react-cs1-integration
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: true
      - name: Checkout tested React interface
        uses: actions/checkout@v4
        with:
          repository: mswhitby/playground-react
          ref: 351a91fa40dba069906caa1a99f72ace082b0e89
          path: react
      - name: Checkout verified canonical read-only account bridge
        uses: actions/checkout@v4
        with:
          repository: mswhitby/playground
          ref: 82ba94ab707ae71db8ebec3cdbdd0dfbe0e45a8b
          path: playground
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the canonical GET-only account and grading adapter
        working-directory: playground
        run: |
          npm ci --no-audit --no-fund
          node --test tests/react-integration-bridge.test.mjs tests/react-teacher-readonly.test.mjs
      - name: Test the React read-only integration interface
        working-directory: react
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Verify canonical CS1 Python challenge catalog before staging
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const catalog=JSON.parse(readFileSync('site/playground/integration/data/computer-science-1/course.json','utf8'));
          const items=catalog.challenges||[];
          if(items.length!==24 || new Set(items.map(item=>item.id)).size!==24)
            throw Error('The published CS1 challenge catalog is missing expected original IDs.');
          for(const item of items) {
            if(!item.title || typeof item.starter!=='string' || !item.examples?.length ||
              item.examples.some(sample=>typeof sample.call!=='string'||typeof sample.expected!=='string'))
              throw Error('Invalid CS1 challenge contract: '+item.id);
          }
          console.log('Verified 24 original CS1 Python challenge contracts.');
          NODE
      - name: Bundle canonical GET-only bridge
        working-directory: playground
        run: |
          ./node_modules/.bin/esbuild frontend/integration-readonly.js --bundle --format=esm --platform=browser --minify --outfile=../account-bridge.js
          grep -q playground_grades ../account-bridge.js
      - name: Bundle permissioned teacher read adapter
        working-directory: playground
        run: |
          ./node_modules/.bin/esbuild public/integration/teacher-readonly.js --bundle --format=esm --platform=browser --minify --outfile=../teacher-bridge.js
          grep -q playground_teacher_snapshot ../teacher-bridge.js
      - name: Build separate CS1 integration site
        working-directory: react
        env:
          VITE_HASH_ROUTING: 'true'
          VITE_READONLY_INTEGRATION: 'true'
        run: npm run build -- --base=/playground/integration/
      - name: Copy ONLY isolated integration assets
        run: |
          mkdir -p site/playground/integration/assets
          rsync -a react/dist/assets/ site/playground/integration/assets/
          cp react/dist/index.html site/playground/integration/index.html
          cp react/dist/python-worker.js site/playground/integration/python-worker.js
          cp account-bridge.js site/playground/integration/account-bridge.js
          cp teacher-bridge.js site/playground/integration/teacher-bridge.js
          grep -q '/playground/integration/assets/' site/playground/integration/index.html
      - name: Publish only integration subtree, preserving live production and preview
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playground/integration/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish isolated CS1 React read-only integration test'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo 'Could not publish isolated integration after three attempts.'
                exit 1
              fi
            done
          fi
